[package]
name = "foundryd"
description = "Foundry daemon — event-driven workflow engine for engineering automation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "foundryd"
path = "src/main.rs"

[dependencies]
foundry-sdk = { workspace = true }
foundry-engine = { workspace = true }
foundry-blocks = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
cron = { workspace = true }
pastey = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", features = ["test-util"] }
# Gateway fakes + block test constructors for engine↔block integration tests.
foundry-sdk = { workspace = true, features = ["test-support"] }
foundry-blocks = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
