[package]
name = "foundry-cli"
description = "Foundry CLI — command-line controller for the Foundry workflow engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "foundry"
path = "src/main.rs"

[dependencies]
foundry-sdk = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
comfy-table = { workspace = true }
cmx-core = "0.3"

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
cmx-core = { version = "0.3", features = ["test-support"] }
# Needed by campaign_pause_grpc integration test: spins up a real FoundryService
# over a tonic gRPC server to exercise the online pause path end-to-end.
foundryd = { path = "../foundryd" }
foundry-sdk = { workspace = true, features = ["test-support"] }
foundry-engine = { workspace = true }
foundry-blocks = { workspace = true }
tokio-stream = { workspace = true }

[lints]
workspace = true
