[package]
name = "foundry-cli"
description = "Foundry CLI — command-line controller for the Foundry workflow engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "foundry"
path = "src/main.rs"

[dependencies]
foundry-sdk = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
comfy-table = { workspace = true }
cmx-core = { git = "https://github.com/svetzal/context-mixer2", rev = "524aa1c24cb67c1660479b6ad6011f2b15322e62" }

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
cmx-core = { git = "https://github.com/svetzal/context-mixer2", rev = "524aa1c24cb67c1660479b6ad6011f2b15322e62", features = ["test-support"] }

[lints]
workspace = true
