syntax = "proto3";

package foundry;

// Throttle controls how far an event ripples through task blocks.
enum Throttle {
    THROTTLE_FULL = 0;       // All task blocks emit downstream events
    THROTTLE_AUDIT_ONLY = 1; // Only observation blocks emit; mutation blocks suppress
    THROTTLE_DRY_RUN = 2;    // Read-only; no side effects, no mutation events
}

// An event emitted into the system.
message Event {
    string id = 1;
    string event_type = 2;
    string project = 3;
    string occurred_at = 4;  // ISO 8601
    string payload_json = 5; // Event-type-specific payload as JSON
    Throttle throttle = 6;
    string trace_id = 7;     // Groups events into a workflow instance
    string span_id = 8;         // Identifies the span this event belongs to.
    string parent_span_id = 9;  // Empty for root spans.
}

// Status of a running or completed workflow.
message WorkflowStatus {
    string workflow_id = 1;
    string workflow_type = 2;
    string project = 3;
    string state = 4;         // pending, running, completed, failed
    string started_at = 5;
    string completed_at = 6;
    repeated TaskBlockStatus task_blocks = 7;
    string trace_id = 8;      // Groups all events belonging to this workflow
}

message TaskBlockStatus {
    string name = 1;
    string state = 2;         // pending, running, completed, skipped, failed
    string started_at = 3;
    string completed_at = 4;
    bool throttled = 5;       // true if emission was suppressed by throttle
}

// Request/response for emitting an event.
message EmitRequest {
    string event_type = 1;
    string project = 2;
    Throttle throttle = 3;
    string payload_json = 4;  // Optional additional payload
    string trace_id = 5;      // Optional; auto-minted if empty
    string span_id = 6;         // Optional. Auto-minted if empty.
    string parent_span_id = 7;  // Optional. Empty ⇒ root span.
}

message EmitResponse {
    string event_id = 1;
    string workflow_id = 2;   // Workflow spawned by this event, if any
}

// Request/response for querying status.
message StatusRequest {
    string workflow_id = 1;   // Specific workflow, or empty for all active
}

message StatusResponse {
    repeated WorkflowStatus workflows = 1;
}

// Request durable trace history from the daemon-owned trace store.
// Online CLI callers render this response directly and do not read, create,
// or mutate a client-side trace directory; if the client-side path is absent,
// the online path leaves it absent. Pass `date` for one exact day or leave it
// empty to request the most recent `recent_days` days (newest first).
message HistoryRequest {
    string date = 1;
    string project = 2;
    uint32 recent_days = 3;
}

message HistoryTrace {
    string event_id = 1;
    string event_type = 2;
    string project = 3;
    bool success = 4;
    uint64 total_duration_ms = 5;
    string trace_id = 6;
}

message HistoryDay {
    string date = 1;
    repeated HistoryTrace traces = 2;
}

message HistoryResponse {
    repeated HistoryDay days = 1;
}

// A block execution record within a trace.
message TraceBlockExecution {
    string block_name = 1;
    string trigger_event_id = 2;
    bool success = 3;
    string summary = 4;
    repeated string emitted_event_ids = 5;
    uint64 duration_ms = 7;
    string raw_output = 8;
    int32 exit_code = 9;
    string trigger_payload_json = 10;
    repeated string emitted_payload_jsons = 11;
    repeated string audit_artifacts = 12;
    string span_id = 13;
    string parent_span_id = 14;
}

// A single event in a trace chain.
message TraceEvent {
    string event_id = 1;
    string event_type = 2;
    string project = 3;
    string occurred_at = 4;
    Throttle throttle = 5;
    string trace_id = 6;     // Workflow instance this event belongs to
    string span_id = 7;
    string parent_span_id = 8;
}

// Request to retrieve a completed event trace.
message TraceRequest {
    string event_id = 1;  // Root event ID to look up
}

// Response containing the full event chain and block executions.
message TraceResponse {
    bool found = 1;
    repeated TraceEvent events = 2;
    repeated TraceBlockExecution block_executions = 3;
    uint64 total_duration_ms = 5;
}

// Request: retrieve a single span's events and block executions.
message SpanRequest {
    string span_id = 1;
}

// Response containing the events and blocks for one span.
message SpanResponse {
    bool found = 1;
    repeated TraceEvent events = 2;
    repeated TraceBlockExecution block_executions = 3;
    uint64 total_duration_ms = 4;
    string trace_id = 5;
}

// Request to subscribe to the live event stream.
message WatchRequest {
    string project = 1;  // Filter by project, or empty string for all projects
}

// A single event delivered over the watch stream.
message WatchResponse {
    string event_id = 1;
    string event_type = 2;
    string project = 3;
    string payload_json = 4;
    string trace_id = 5;     // Workflow instance this event belongs to
    string span_id = 6;
    string parent_span_id = 7;
}

// A project entry in the registry.
message Project {
    string name = 1;
    string path = 2;
    string stack = 3;
    string agent = 4;
    string repo = 5;
    string branch = 6;
    string skip = 7;         // Empty string means not skipped.
    bool iterate = 8;
    bool maintain = 9;
    bool push = 10;
    bool audit = 11;
    bool release = 12;
    string install_command = 13;  // Empty means not set.
    string install_brew = 14;     // Empty means not set.
    string notes = 15;            // Empty means not set.
    uint64 timeout_secs = 16;     // 0 means use default (3600).
    bool installs_skill_default = 17;          // true => derive default init command.
    bool installs_skill_explicitly_disabled = 18; // true => explicit "off".
    string installs_skill_command = 19;        // Empty means not set.
    repeated string audit_exceptions = 20;     // Empty means none configured.
}

// List every project from the daemon-owned registry.
// Online CLI callers render this response directly and do not read, create,
// or mutate a client-side registry file; if the client-side path is absent,
// the online path leaves it absent. `foundry registry init` remains offline-
// only recovery and never contacts this RPC surface.
message RegistryListRequest {}

message RegistryListResponse {
    repeated Project projects = 1;
}

// Retrieve one exact-name project from the daemon-owned registry.
// Online CLI callers render this response directly and do not read, create,
// or mutate a client-side registry file; if the client-side path is absent,
// the online path leaves it absent.
message RegistryShowRequest {
    string name = 1;
}

message RegistryShowResponse {
    Project project = 1;
}

// Add a project to the daemon-owned registry.
// Online CLI callers mutate daemon-owned state only; they do not fall back to
// client-side registry file writes unless `--offline` is explicit. If daemon
// persistence fails, the RPC returns INTERNAL and leaves both the in-memory
// registry and on-disk daemon-owned registry bytes unchanged.
message RegistryAddRequest {
    string name = 1;
    string path = 2;
    string stack = 3;
    string agent = 4;
    string repo = 5;
    string branch = 6;
    bool iterate = 7;
    bool maintain = 8;
    bool push = 9;
    bool audit = 10;
    bool release = 11;
    string install_command = 12;
    string install_brew = 13;
    string notes = 14;
    uint64 timeout_secs = 15;
}

message RegistryAddResponse {
    Project project = 1;
}

// Remove a project from the daemon-owned registry by exact name.
// Online CLI callers mutate daemon-owned state only; they do not fall back to
// client-side registry file writes unless `--offline` is explicit. If daemon
// persistence fails, the RPC returns INTERNAL and leaves both the in-memory
// registry and on-disk daemon-owned registry bytes unchanged.
message RegistryRemoveRequest {
    string name = 1;
}

message RegistryRemoveResponse {}

// Edit a project in the daemon-owned registry by exact name.
// Only non-empty / non-zero fields are applied as updates.
// Use clear_skip = true to explicitly clear the skip field.
// Use clear_notes = true to explicitly clear the notes field.
// Use clear_install = true to explicitly clear the install config.
// Use clear_timeout = true to explicitly clear the timeout (revert to default).
// Online CLI callers mutate daemon-owned state only; they do not fall back to
// client-side registry file writes unless `--offline` is explicit. If daemon
// persistence fails, the RPC returns INTERNAL and leaves both the in-memory
// registry and on-disk daemon-owned registry bytes unchanged.
message RegistryEditRequest {
    string name = 1;
    string path = 2;
    string stack = 3;
    string agent = 4;
    string repo = 5;
    string branch = 6;
    string skip = 7;
    bool clear_skip = 8;
    bool iterate = 9;
    bool clear_iterate = 10;
    bool maintain = 11;
    bool clear_maintain = 12;
    bool push = 13;
    bool clear_push = 14;
    bool audit = 15;
    bool clear_audit = 16;
    bool release = 17;
    bool clear_release = 18;
    string install_command = 19;
    string install_brew = 20;
    bool clear_install = 21;
    string notes = 22;
    bool clear_notes = 23;
    uint64 timeout_secs = 24;
    bool clear_timeout = 25;
}

message RegistryEditResponse {
    Project project = 1;
}

// Add one campaign definition to the daemon-owned campaign store.
// Online CLI callers send the parsed definition through this typed RPC and do
// not read, create, or mutate a client-side campaigns file unless `--offline`
// is explicit. The daemon validates the referenced project and context paths
// against daemon-owned registry state before persisting.
message AddCampaignRequest {
    string definition_json = 1;
}

message AddCampaignResponse {
    CampaignDetail campaign = 1;
}

// Request the durable campaign inventory. When project is non-empty, the
// result contains only campaigns whose project exactly matches that value.
message ListCampaignsRequest {
    string project = 1;
}

// Read-only wire form of a campaign. This exposes summary/status fields only;
// it intentionally omits context paths, done evidence internals, escalation
// rules, and filesystem details.
message Campaign {
    string name = 1;
    string project = 2;
    string mission = 3;
    string status = 4;
    uint64 cycles_completed = 5;
    uint64 cycles_landed = 6;
    uint64 max_cycles = 7;
    string authorized_by = 8;
    string agent_provider = 9;
    string last_run_event_id = 10;
}

message ListCampaignsResponse {
    repeated Campaign campaigns = 1;
}

// One done-evidence item from a campaign definition. The kind field is either
// "gate" (command + required + artifacts) or "review" (statement).
message DoneEvidence {
    // "gate" or "review"
    string kind = 1;
    // Gate variant: the shell command to evaluate.
    string command = 2;
    // Gate variant: whether this gate is required for completion.
    bool required = 3;
    // Review variant: the human-readable completion statement.
    string statement = 4;
    // Gate variant: repository-relative artifacts that must exist before the
    // command is eligible to pass.
    repeated string artifacts = 5;
}

// One owner-authored campaign decision recorded after an escalation.
// These records are append-only and treated as binding policy on subsequent
// formation runs.
message OwnerDecision {
    string decision = 1;
    string authorized_by = 2;
    string decided_at = 3;
}

// Full durable definition of a campaign, as returned by GetCampaign.
// Carries all fields that Campaign (the summary form) intentionally omits.
message CampaignDetail {
    string name = 1;
    string project = 2;
    string mission = 3;
    string status = 4;
    uint64 cycles_completed = 5;
    uint64 cycles_landed = 6;
    uint64 max_cycles = 7;
    string authorized_by = 8;
    string agent_provider = 9;
    string last_run_event_id = 10;
    repeated string intent_refs = 11;
    repeated string context_paths = 12;
    repeated DoneEvidence done_evidence = 13;
    repeated string escalation = 14;
    repeated OwnerDecision owner_decisions = 15;
}

message GetCampaignRequest {
    string name = 1;
}

message GetCampaignResponse {
    CampaignDetail campaign = 1;
}

// Pause a campaign. Idempotent on the status field; never clears pending_run_result.
message PauseCampaignRequest {
    string name = 1;
}

message PauseCampaignResponse {
    // Full campaign detail reflecting the state after the pause is applied.
    CampaignDetail campaign = 1;
}

// Resume a paused campaign, optionally extending its cycle budget.
// `add_cycles` is applied to `budget.max_cycles` exactly once via checked
// addition (overflow → FAILED_PRECONDITION). Pass 0 to resume without
// extending the budget.
// Requires `authorized_by` to be set; returns FAILED_PRECONDITION otherwise.
// Only valid when the campaign is in `paused` status.
message ResumeCampaignRequest {
    string name = 1;
    // Non-negative number of additional cycles to add to `max_cycles`.
    uint64 add_cycles = 2;
}

message ResumeCampaignResponse {
    // Full campaign detail reflecting the state after the resume is applied.
    CampaignDetail campaign = 1;
}

// Record an owner decision on an escalated campaign and return it to active
// state so the next advance can proceed with the explicit policy in context.
message DecideCampaignRequest {
    string name = 1;
    string decision = 2;
}

message DecideCampaignResponse {
    // Full campaign detail reflecting the state after the decision is applied.
    CampaignDetail campaign = 1;
}

// Mark an authorized campaign complete from outside the formation loop.
// The non-empty reason is retained as an append-only owner record and the
// daemon emits CampaignCompleted so terminal observers see the transition.
message CompleteCampaignRequest {
    string name = 1;
    string reason = 2;
}

message CompleteCampaignResponse {
    CampaignDetail campaign = 1;
}

// Manually dispatch one advance iteration for an active campaign.
// Valid only when the campaign is `active` or `staged`; returns
// FAILED_PRECONDITION for `paused`, `escalated`, or `completed` campaigns.
message AdvanceCampaignRequest {
    string name = 1;
}

message AdvanceCampaignResponse {
    // Current campaign detail at the time the advance was dispatched.
    // The advance itself is asynchronous; poll GetCampaign to observe the
    // outcome.
    CampaignDetail campaign = 1;
    // Root event ID of the CampaignAdvanceRequested workflow.
    string event_id = 2;
}

// Wire form of a sentinel — a scheduled trigger that emits an event when due.
message Sentinel {
    string name = 1;
    // Cron schedule in standard 5-field form (e.g. "0 2 * * *"), evaluated in
    // local time. The daemon auto-pads 5-field expressions with a leading "0"
    // for seconds before passing them to the cron parser.
    string cron = 2;
    // Event type the sentinel emits when it fires (e.g. "maintenance_cycle_started").
    string emit_event_type = 3;
    // Project name set on the emitted event (e.g. "system" for cycle-roots).
    string emit_project = 4;
    // Throttle level: 0 = full (default), 1 = dry_run.
    int32 emit_throttle = 5;
    // JSON payload attached to the emitted event ("{}" if empty).
    string emit_payload_json = 6;
    bool enabled = 7;
}

// Mark a sentinel as enabled. Wakes the scheduler so the next firing is
// armed immediately.
message SentinelEnableRequest {
    string name = 1;
}

message SentinelEnableResponse {
    Sentinel sentinel = 1;
}

// Mark a sentinel as disabled. Wakes the scheduler so any pending firing
// for this entry is cancelled.
message SentinelDisableRequest {
    string name = 1;
}

message SentinelDisableResponse {
    Sentinel sentinel = 1;
}

// List every daemon-owned sentinel.
message SentinelListRequest {}

message SentinelListResponse {
    repeated Sentinel sentinels = 1;
}

// Retrieve one daemon-owned sentinel by exact name.
message SentinelShowRequest {
    string name = 1;
}

message SentinelShowResponse {
    Sentinel sentinel = 1;
}

// The Foundry service.
service Foundry {
    // Emit an event into the system. May trigger a workflow.
    rpc Emit(EmitRequest) returns (EmitResponse);

    // Get status of active workflows.
    rpc Status(StatusRequest) returns (StatusResponse);

    // List durable trace history from the daemon-owned trace store.
    rpc History(HistoryRequest) returns (HistoryResponse);

    // Stream events in real-time as they occur during engine processing.
    rpc Watch(WatchRequest) returns (stream WatchResponse);

    // Retrieve the trace of a completed event chain.
    rpc Trace(TraceRequest) returns (TraceResponse);

    // Add a project to the daemon-owned registry.
    rpc RegistryAdd(RegistryAddRequest) returns (RegistryAddResponse);

    // List every project from the daemon-owned registry.
    rpc RegistryList(RegistryListRequest) returns (RegistryListResponse);

    // Retrieve one project from the daemon-owned registry by exact name.
    rpc RegistryShow(RegistryShowRequest) returns (RegistryShowResponse);

    // Remove a project from the daemon-owned registry.
    rpc RegistryRemove(RegistryRemoveRequest) returns (RegistryRemoveResponse);

    // Edit a project in the daemon-owned registry.
    rpc RegistryEdit(RegistryEditRequest) returns (RegistryEditResponse);

    // Add one durable campaign definition to the configured campaign store.
    rpc AddCampaign(AddCampaignRequest) returns (AddCampaignResponse);

    // List durable campaigns from the configured campaign store.
    rpc ListCampaigns(ListCampaignsRequest) returns (ListCampaignsResponse);

    // Retrieve the complete durable definition of one campaign by exact name.
    rpc GetCampaign(GetCampaignRequest) returns (GetCampaignResponse);

    // Pause an active campaign. Preserves pending_run_result.
    rpc PauseCampaign(PauseCampaignRequest) returns (PauseCampaignResponse);

    // Resume a paused campaign, optionally extending its cycle budget.
    rpc ResumeCampaign(ResumeCampaignRequest) returns (ResumeCampaignResponse);

    // Record an owner decision on an escalated campaign and return it to active state.
    rpc DecideCampaign(DecideCampaignRequest) returns (DecideCampaignResponse);

    // Mark an authorized campaign complete with an auditable owner reason.
    rpc CompleteCampaign(CompleteCampaignRequest) returns (CompleteCampaignResponse);

    // Manually dispatch one advance iteration for an active campaign.
    rpc AdvanceCampaign(AdvanceCampaignRequest) returns (AdvanceCampaignResponse);

    // Mark a sentinel as enabled. Persists to disk and wakes the scheduler.
    rpc SentinelEnable(SentinelEnableRequest) returns (SentinelEnableResponse);

    // Mark a sentinel as disabled. Persists to disk and wakes the scheduler.
    rpc SentinelDisable(SentinelDisableRequest) returns (SentinelDisableResponse);

    // List every daemon-owned sentinel.
    rpc SentinelList(SentinelListRequest) returns (SentinelListResponse);

    // Retrieve one daemon-owned sentinel by exact name.
    rpc SentinelShow(SentinelShowRequest) returns (SentinelShowResponse);

    // Retrieve every event and block execution within a single span.
    rpc Span(SpanRequest) returns (SpanResponse);
}
