syntax = "proto3";

package foundry;

// Throttle controls how far an event ripples through task blocks.
enum Throttle {
    THROTTLE_FULL = 0;       // All task blocks emit downstream events
    THROTTLE_AUDIT_ONLY = 1; // Only observation blocks emit; mutation blocks suppress
    THROTTLE_DRY_RUN = 2;    // Read-only; no side effects, no mutation events
}

// An event emitted into the system.
message Event {
    string id = 1;
    string event_type = 2;
    string project = 3;
    string occurred_at = 4;  // ISO 8601
    string payload_json = 5; // Event-type-specific payload as JSON
    Throttle throttle = 6;
    string trace_id = 7;     // Groups events into a workflow instance
}

// Status of a running or completed workflow.
message WorkflowStatus {
    string workflow_id = 1;
    string workflow_type = 2;
    string project = 3;
    string state = 4;         // pending, running, completed, failed
    string started_at = 5;
    string completed_at = 6;
    repeated TaskBlockStatus task_blocks = 7;
    string trace_id = 8;      // Groups all events belonging to this workflow
}

message TaskBlockStatus {
    string name = 1;
    string state = 2;         // pending, running, completed, skipped, failed
    string started_at = 3;
    string completed_at = 4;
    bool throttled = 5;       // true if emission was suppressed by throttle
}

// Request/response for emitting an event.
message EmitRequest {
    string event_type = 1;
    string project = 2;
    Throttle throttle = 3;
    string payload_json = 4;  // Optional additional payload
    string trace_id = 5;      // Optional; auto-minted if empty
}

message EmitResponse {
    string event_id = 1;
    string workflow_id = 2;   // Workflow spawned by this event, if any
}

// Request/response for querying status.
message StatusRequest {
    string workflow_id = 1;   // Specific workflow, or empty for all active
}

message StatusResponse {
    repeated WorkflowStatus workflows = 1;
}

// A block execution record within a trace.
message TraceBlockExecution {
    string block_name = 1;
    string trigger_event_id = 2;
    bool success = 3;
    string summary = 4;
    repeated string emitted_event_ids = 5;
    uint64 duration_ms = 7;
    string raw_output = 8;
    int32 exit_code = 9;
    string trigger_payload_json = 10;
    repeated string emitted_payload_jsons = 11;
    repeated string audit_artifacts = 12;
}

// A single event in a trace chain.
message TraceEvent {
    string event_id = 1;
    string event_type = 2;
    string project = 3;
    string occurred_at = 4;
    Throttle throttle = 5;
    string trace_id = 6;     // Workflow instance this event belongs to
}

// Request to retrieve a completed event trace.
message TraceRequest {
    string event_id = 1;  // Root event ID to look up
}

// Response containing the full event chain and block executions.
message TraceResponse {
    bool found = 1;
    repeated TraceEvent events = 2;
    repeated TraceBlockExecution block_executions = 3;
    uint64 total_duration_ms = 5;
}

// Request to subscribe to the live event stream.
message WatchRequest {
    string project = 1;  // Filter by project, or empty string for all projects
}

// A single event delivered over the watch stream.
message WatchResponse {
    string event_id = 1;
    string event_type = 2;
    string project = 3;
    string payload_json = 4;
    string trace_id = 5;     // Workflow instance this event belongs to
}

// A project entry in the registry.
message Project {
    string name = 1;
    string path = 2;
    string stack = 3;
    string agent = 4;
    string repo = 5;
    string branch = 6;
    string skip = 7;         // Empty string means not skipped.
    bool iterate = 8;
    bool maintain = 9;
    bool push = 10;
    bool audit = 11;
    bool release = 12;
    string install_command = 13;  // Empty means not set.
    string install_brew = 14;     // Empty means not set.
    string notes = 15;            // Empty means not set.
    uint64 timeout_secs = 16;     // 0 means use default (3600).
}

// Add a project to the registry.
message RegistryAddRequest {
    string name = 1;
    string path = 2;
    string stack = 3;
    string agent = 4;
    string repo = 5;
    string branch = 6;
    bool iterate = 7;
    bool maintain = 8;
    bool push = 9;
    bool audit = 10;
    bool release = 11;
    string install_command = 12;
    string install_brew = 13;
    string notes = 14;
    uint64 timeout_secs = 15;
}

message RegistryAddResponse {
    Project project = 1;
}

// Remove a project from the registry.
message RegistryRemoveRequest {
    string name = 1;
}

message RegistryRemoveResponse {}

// Edit a project in the registry.
// Only non-empty / non-zero fields are applied as updates.
// Use clear_skip = true to explicitly clear the skip field.
// Use clear_notes = true to explicitly clear the notes field.
// Use clear_install = true to explicitly clear the install config.
// Use clear_timeout = true to explicitly clear the timeout (revert to default).
message RegistryEditRequest {
    string name = 1;
    string path = 2;
    string stack = 3;
    string agent = 4;
    string repo = 5;
    string branch = 6;
    string skip = 7;
    bool clear_skip = 8;
    bool iterate = 9;
    bool clear_iterate = 10;
    bool maintain = 11;
    bool clear_maintain = 12;
    bool push = 13;
    bool clear_push = 14;
    bool audit = 15;
    bool clear_audit = 16;
    bool release = 17;
    bool clear_release = 18;
    string install_command = 19;
    string install_brew = 20;
    bool clear_install = 21;
    string notes = 22;
    bool clear_notes = 23;
    uint64 timeout_secs = 24;
    bool clear_timeout = 25;
}

message RegistryEditResponse {
    Project project = 1;
}

// The Foundry service.
service Foundry {
    // Emit an event into the system. May trigger a workflow.
    rpc Emit(EmitRequest) returns (EmitResponse);

    // Get status of active workflows.
    rpc Status(StatusRequest) returns (StatusResponse);

    // Stream events in real-time as they occur during engine processing.
    rpc Watch(WatchRequest) returns (stream WatchResponse);

    // Retrieve the trace of a completed event chain.
    rpc Trace(TraceRequest) returns (TraceResponse);

    // Add a project to the registry.
    rpc RegistryAdd(RegistryAddRequest) returns (RegistryAddResponse);

    // Remove a project from the registry.
    rpc RegistryRemove(RegistryRemoveRequest) returns (RegistryRemoveResponse);

    // Edit a project in the registry.
    rpc RegistryEdit(RegistryEditRequest) returns (RegistryEditResponse);
}
