syntax = "proto3";

package foundry;

// Throttle controls how far an event ripples through task blocks.
enum Throttle {
    THROTTLE_FULL = 0;       // All task blocks emit downstream events
    THROTTLE_AUDIT_ONLY = 1; // Only observation blocks emit; mutation blocks suppress
    THROTTLE_DRY_RUN = 2;    // Read-only; no side effects, no mutation events
}

// An event emitted into the system.
message Event {
    string id = 1;
    string event_type = 2;
    string project = 3;
    string occurred_at = 4;  // ISO 8601
    string payload_json = 5; // Event-type-specific payload as JSON
    Throttle throttle = 6;
    string trace_id = 7;     // Groups events into a workflow instance
    string span_id = 8;         // Identifies the span this event belongs to.
    string parent_span_id = 9;  // Empty for root spans.
}

// Status of a running or completed workflow.
message WorkflowStatus {
    string workflow_id = 1;
    string workflow_type = 2;
    string project = 3;
    string state = 4;         // pending, running, completed, failed
    string started_at = 5;
    string completed_at = 6;
    repeated TaskBlockStatus task_blocks = 7;
    string trace_id = 8;      // Groups all events belonging to this workflow
}

message TaskBlockStatus {
    string name = 1;
    string state = 2;         // pending, running, completed, skipped, failed
    string started_at = 3;
    string completed_at = 4;
    bool throttled = 5;       // true if emission was suppressed by throttle
}

// What dispatched a unit of work, typed. A closed set of kinds, each with the
// one reference that names the dispatcher; never a free string.
//
//   kind        ref                         cycle
//   campaign    the campaign name           the cycle number
//   sentinel    the sentinel name           absent
//   operator    the submitting client host  absent
//   work_item   the parent work item id     absent
//
// Rides the event envelope from the root a submitter emits down every hop of
// its chain, and is recorded on the work item the chain opens. An unknown kind
// is INVALID_ARGUMENT wherever a WorkSource is accepted.
message WorkSource {
    string kind = 1;
    string ref = 2;
    optional uint64 cycle = 3;
}

// Request/response for emitting an event.
message EmitRequest {
    string event_type = 1;
    string project = 2;
    Throttle throttle = 3;
    string payload_json = 4;  // Optional additional payload
    string trace_id = 5;      // Optional; auto-minted if empty
    string span_id = 6;         // Optional. Auto-minted if empty.
    string parent_span_id = 7;  // Optional. Empty ⇒ root span.
    // Optional. What dispatched the work this root starts; the CLI sends
    // `operator` with its hostname. Absent means the root names no source,
    // which is exactly what a request from an older client sends, and every
    // work item the chain records then carries no source. Additive.
    WorkSource source = 8;
}

message EmitResponse {
    string event_id = 1;
    string workflow_id = 2;   // Workflow spawned by this event, if any
}

// Request/response for querying status.
message StatusRequest {
    string workflow_id = 1;   // Specific workflow, or empty for all active
}

message StatusResponse {
    repeated WorkflowStatus workflows = 1;
}

// Request durable trace history from the daemon-owned trace store.
// Online CLI callers render this response directly and do not read, create,
// or mutate a client-side trace directory; if the client-side path is absent,
// the online path leaves it absent. Pass `date` for one exact day or leave it
// empty to request the most recent `recent_days` days (newest first).
message HistoryRequest {
    string date = 1;
    string project = 2;
    uint32 recent_days = 3;
}

message HistoryTrace {
    string event_id = 1;
    string event_type = 2;
    string project = 3;
    bool success = 4;
    uint64 total_duration_ms = 5;
    string trace_id = 6;
}

message HistoryDay {
    string date = 1;
    repeated HistoryTrace traces = 2;
}

message HistoryResponse {
    repeated HistoryDay days = 1;
}

// A block execution record within a trace.
message TraceBlockExecution {
    string block_name = 1;
    string trigger_event_id = 2;
    bool success = 3;
    string summary = 4;
    repeated string emitted_event_ids = 5;
    uint64 duration_ms = 7;
    string raw_output = 8;
    int32 exit_code = 9;
    string trigger_payload_json = 10;
    repeated string emitted_payload_jsons = 11;
    repeated string audit_artifacts = 12;
    string span_id = 13;
    string parent_span_id = 14;
}

// A single event in a trace chain.
message TraceEvent {
    string event_id = 1;
    string event_type = 2;
    string project = 3;
    string occurred_at = 4;
    Throttle throttle = 5;
    string trace_id = 6;     // Workflow instance this event belongs to
    string span_id = 7;
    string parent_span_id = 8;
}

// Request to retrieve a completed event trace.
message TraceRequest {
    string event_id = 1;  // Root event ID to look up
}

// Response containing the full event chain and block executions.
message TraceResponse {
    bool found = 1;
    repeated TraceEvent events = 2;
    repeated TraceBlockExecution block_executions = 3;
    uint64 total_duration_ms = 5;
}

// Request: retrieve a single span's events and block executions.
message SpanRequest {
    string span_id = 1;
}

// Response containing the events and blocks for one span.
message SpanResponse {
    bool found = 1;
    repeated TraceEvent events = 2;
    repeated TraceBlockExecution block_executions = 3;
    uint64 total_duration_ms = 4;
    string trace_id = 5;
}

// Request to subscribe to the live event stream.
message WatchRequest {
    string project = 1;  // Filter by project, or empty string for all projects
}

// A single event delivered over the watch stream.
message WatchResponse {
    string event_id = 1;
    string event_type = 2;
    string project = 3;
    string payload_json = 4;
    string trace_id = 5;     // Workflow instance this event belongs to
    string span_id = 6;
    string parent_span_id = 7;
}

// A project entry in the registry.
message Project {
    string name = 1;
    string path = 2;
    string stack = 3;
    string agent = 4;
    string repo = 5;
    string branch = 6;
    string skip = 7;         // Empty string means not skipped.
    bool iterate = 8;
    bool maintain = 9;
    bool push = 10;
    bool audit = 11;
    bool release = 12;
    string install_command = 13;  // Empty means not set.
    string install_brew = 14;     // Empty means not set.
    string notes = 15;            // Empty means not set.
    uint64 timeout_secs = 16;     // 0 means use default (3600).
    bool installs_skill_default = 17;          // true => derive default init command.
    bool installs_skill_explicitly_disabled = 18; // true => explicit "off".
    string installs_skill_command = 19;        // Empty means not set.
    repeated string audit_exceptions = 20;     // Empty means none configured.
    string update_policy = 21;                 // patch | minor | major; empty means not set (maintenance behaves as minor).
}

// List every project from the daemon-owned registry.
// Online CLI callers render this response directly and do not read, create,
// or mutate a client-side registry file; if the client-side path is absent,
// the online path leaves it absent. `foundry registry init` remains offline-
// only recovery and never contacts this RPC surface.
message RegistryListRequest {}

message RegistryListResponse {
    repeated Project projects = 1;
}

// Retrieve one exact-name project from the daemon-owned registry.
// Online CLI callers render this response directly and do not read, create,
// or mutate a client-side registry file; if the client-side path is absent,
// the online path leaves it absent.
message RegistryShowRequest {
    string name = 1;
}

message RegistryShowResponse {
    Project project = 1;
}

// Add a project to the daemon-owned registry.
// Online CLI callers mutate daemon-owned state only; they do not fall back to
// client-side registry file writes unless `--offline` is explicit. If daemon
// persistence fails, the RPC returns INTERNAL and leaves both the in-memory
// registry and on-disk daemon-owned registry bytes unchanged.
message RegistryAddRequest {
    string name = 1;
    string path = 2;
    string stack = 3;
    string agent = 4;
    string repo = 5;
    string branch = 6;
    bool iterate = 7;
    bool maintain = 8;
    bool push = 9;
    bool audit = 10;
    bool release = 11;
    string install_command = 12;
    string install_brew = 13;
    string notes = 14;
    uint64 timeout_secs = 15;
    string update_policy = 16;   // patch | minor | major; empty means not set.
    string installs_skill = 17;  // true, false, or a command; empty means not set.
}

message RegistryAddResponse {
    Project project = 1;
}

// Remove a project from the daemon-owned registry by exact name.
// Online CLI callers mutate daemon-owned state only; they do not fall back to
// client-side registry file writes unless `--offline` is explicit. If daemon
// persistence fails, the RPC returns INTERNAL and leaves both the in-memory
// registry and on-disk daemon-owned registry bytes unchanged.
message RegistryRemoveRequest {
    string name = 1;
}

message RegistryRemoveResponse {}

// Edit a project in the daemon-owned registry by exact name.
// Only non-empty / non-zero fields are applied as updates.
// Use clear_skip = true to explicitly clear the skip field.
// Use clear_notes = true to explicitly clear the notes field.
// Use clear_install = true to explicitly clear the install config.
// Use clear_timeout = true to explicitly clear the timeout (revert to default).
// Online CLI callers mutate daemon-owned state only; they do not fall back to
// client-side registry file writes unless `--offline` is explicit. If daemon
// persistence fails, the RPC returns INTERNAL and leaves both the in-memory
// registry and on-disk daemon-owned registry bytes unchanged.
message RegistryEditRequest {
    string name = 1;
    string path = 2;
    string stack = 3;
    string agent = 4;
    string repo = 5;
    string branch = 6;
    string skip = 7;
    bool clear_skip = 8;
    bool iterate = 9;
    bool clear_iterate = 10;
    bool maintain = 11;
    bool clear_maintain = 12;
    bool push = 13;
    bool clear_push = 14;
    bool audit = 15;
    bool clear_audit = 16;
    bool release = 17;
    bool clear_release = 18;
    string install_command = 19;
    string install_brew = 20;
    bool clear_install = 21;
    string notes = 22;
    bool clear_notes = 23;
    uint64 timeout_secs = 24;
    bool clear_timeout = 25;
    string update_policy = 26;   // patch | minor | major; empty leaves it unchanged.
    string installs_skill = 27;  // true, false, or a command; empty leaves it unchanged.
}

message RegistryEditResponse {
    Project project = 1;
}

// Add one campaign definition to the daemon-owned campaign store.
// Online CLI callers send the parsed definition through this typed RPC and do
// not read, create, or mutate a client-side campaigns file unless `--offline`
// is explicit. The daemon validates the referenced project and context paths
// against daemon-owned registry state before persisting.
message AddCampaignRequest {
    string definition_json = 1;
}

message AddCampaignResponse {
    CampaignDetail campaign = 1;
}

// Request the durable campaign inventory. When project is non-empty, the
// result contains only campaigns whose project exactly matches that value.
message ListCampaignsRequest {
    string project = 1;
}

// Read-only wire form of a campaign. This exposes summary/status fields only;
// it intentionally omits context paths, done evidence internals, escalation
// rules, and filesystem details.
message Campaign {
    string name = 1;
    string project = 2;
    string mission = 3;
    string status = 4;
    uint64 cycles_completed = 5;
    uint64 cycles_landed = 6;
    uint64 max_cycles = 7;
    string authorized_by = 8;
    string agent_provider = 9;
    string last_run_event_id = 10;
    // Why the campaign waits on its owner. Set only while status is
    // "escalated", and then absent only when no reason was ever recorded.
    CampaignEscalation open_escalation = 11;
    optional string initiative = 12;
    StageProviders providers = 13;
    RecoveryState recovery = 14;
}

// Why an escalated campaign waits on its owner.
//
// The daemon reads it from the campaign record, which formation writes when it
// escalates the campaign. A campaign that escalated before the record existed
// has none, so the daemon recovers it from the newest `campaign_escalated`
// event naming the campaign and sets from_event_log. It never writes that
// recovered record back into the campaign store.
message CampaignEscalation {
    string reason = 1;
    // RFC 3339.
    string escalated_at = 2;
    uint64 cycles_completed = 3;
    uint64 cycles_landed = 4;
    // The task agent's question, when a task stopped with blocked_on_decision.
    optional string question = 5;
    // The choices the task agent offered with its question.
    repeated string choices = 6;
    bool from_event_log = 7;
}

message ListCampaignsResponse {
    repeated Campaign campaigns = 1;
}

// One done-evidence item from a campaign definition. The kind field is either
// "gate" (command + required + artifacts) or "review" (statement).
message DoneEvidence {
    // "gate" or "review"
    string kind = 1;
    // Gate variant: the shell command to evaluate.
    string command = 2;
    // Gate variant: whether this gate is required for completion.
    bool required = 3;
    // Review variant: the human-readable completion statement.
    string statement = 4;
    // Gate variant: repository-relative artifacts that must exist before the
    // command is eligible to pass.
    repeated string artifacts = 5;
}

// One owner-authored campaign decision recorded after an escalation.
// These records are append-only and treated as binding policy on subsequent
// formation runs.
message OwnerDecision {
    string decision = 1;
    string authorized_by = 2;
    string decided_at = 3;
}

// Full durable definition of a campaign, as returned by GetCampaign.
// Carries all fields that Campaign (the summary form) intentionally omits.
message CampaignDetail {
    string name = 1;
    string project = 2;
    string mission = 3;
    string status = 4;
    uint64 cycles_completed = 5;
    uint64 cycles_landed = 6;
    uint64 max_cycles = 7;
    string authorized_by = 8;
    string agent_provider = 9;
    string last_run_event_id = 10;
    repeated string intent_refs = 11;
    repeated string context_paths = 12;
    repeated DoneEvidence done_evidence = 13;
    repeated string escalation = 14;
    repeated OwnerDecision owner_decisions = 15;
    // Why the campaign waits on its owner; see Campaign.open_escalation.
    CampaignEscalation open_escalation = 16;
    optional string initiative = 17;
    StageProviders providers = 18;
    RecoveryState recovery = 19;
}

// Stage overrides inherit the campaign's agent_provider when omitted.
message StageProviders {
    optional string formation = 1;
    optional string execution = 2;
    optional string review = 3;
}
message InitiativeMember {
    string kind = 1;
    string name = 2;
    repeated string after = 3;
    optional string intent_ref = 4;
    optional string description = 5;
    Campaign campaign = 6;
    optional string last_verdict = 7;
    repeated string reviewer_gaps = 8;
    optional string intent_state = 9;
    optional string audit_finding_id = 10;
    optional string project = 11;
}
// Read-only admission diagnostics, recomputed from current store and ledger.
message ReadinessBlocker { string kind = 1; string detail = 2; }
message DependencyReadiness {
    string prerequisite = 1;
    string member = 2;
    string milestone = 3;
    bool satisfied = 4;
    repeated string evidence = 5;
}
message MemberReadiness {
    string member = 1;
    bool ready = 2;
    repeated ReadinessBlocker blockers = 3;
    repeated DependencyReadiness dependencies = 4;
}
message InitiativeReadiness {
    repeated MemberReadiness members = 1;
    bool dispatch_open = 2;
    repeated string occupied = 3;
    uint64 max_active_members = 4;
    string observed_at = 5;
    // False for offline store-only inspection without live ledger/registry.
    bool live = 6;
}
message InitiativeBudget {
    uint64 max_cycles = 1;
    uint64 max_active_members = 2;
    uint64 max_open_questions = 3;
}
message InitiativeBrief {
    string path = 1;
    string hash = 2;
}
message InitiativeEvidence {
    string kind = 1;
    string command = 2;
    optional string host = 3;
    bool required = 4;
    repeated string artifacts = 5;
    string statement = 6;
}
message InitiativeDecision {
    string decision = 1;
    string authorized_by = 2;
    string decided_at = 3;
    repeated string members = 4;
    repeated string question_ids = 5;
}
// Operational prerequisites are separate from owner decisions.
message RecoveryResolution {
    repeated string evidence = 1;
    string resolved_at = 2;
}
message RecoveryState {
    string id = 1;
    string kind = 2;
    string detail = 3;
    string recorded_at = 4;
    RecoveryResolution resolution = 5;
}
message RecoverRequest {
    string name = 1;
    string recovery_id = 2;
    repeated string evidence = 3;
}
message RecoverResponse {
    RecoveryState recovery = 1;
    string event_id = 2;
    // Evidence recorded, but normal owner/pacing controls may still block work.
    string waiting_reason = 3;
}
message InitiativeStatusNote {
    string text = 1;
    string recorded_at = 2;
}
message InitiativeQuestion {
    string id = 1;
    string question = 2;
    repeated string members = 3;
    string opened_at = 4;
}
message Initiative {
    string name = 1;
    string outcome = 2;
    repeated string intent_refs = 3;
    repeated string projects = 4;
    InitiativeBrief brief = 5;
    repeated InitiativeMember members = 6;
    repeated InitiativeEvidence done_evidence = 7;
    InitiativeBudget budget = 8;
    optional string authorized_by = 9;
    StageProviders providers = 10;
    string status = 11;
    repeated InitiativeDecision owner_decisions = 12;
    repeated InitiativeQuestion open_questions = 13;
    optional string agent_provider = 14;
    DeriveSource derive_source = 15;
    repeated StageProviders provider_pairings = 16;
    repeated MemberHold holds = 17;
    repeated MemberMilestone milestones = 18;
    repeated TaskDispatch task_dispatches = 19;
    repeated MemberReservation reservations = 20;
    SteeringLease steering = 21;
    repeated EtCloseProposal close_proposals = 22;
    bool steering_enabled = 23;
    repeated SteeringRecord steering_history = 24;
    repeated DurableSteeringAction pending_actions = 25;
    string intent_revision = 26;
    repeated InitiativeWorkAdmission work_admissions = 27;
    optional uint64 pairing_base_cycles = 28;
    uint64 steering_history_count = 29;
    repeated InitiativeIntegrationResult integration_results = 30;
    InitiativeCompletionProposal completion_proposal = 31;
    InitiativeCompletionConfirmation completion_confirmation = 32;
    repeated InitiativeEtCloseReceipt completion_receipts = 33;
    // Unanswered facts waiting for room under max_open_questions.
    uint64 deferred_question_count = 34;
    repeated InitiativeStatusNote status_notes = 35;
    repeated InitiativeQuestion deferred_questions = 36;
    RecoveryState recovery = 37;
    InitiativeReadiness readiness = 38;
}
message InitiativeRepositoryIdentity {
    string project = 1;
    string root = 2;
    string registry = 3;
    string trunk = 4;
    string head = 5;
    string status = 6;
    string diff = 7;
}
message InitiativeOutcomeSnapshot {
    repeated InitiativeRepositoryIdentity repositories = 1;
    string intent_revision = 2;
    string policy_hash = 3;
}
message InitiativeIntegrationResult {
    string id = 1;
    uint64 gate_index = 2;
    string host = 3;
    string command = 4;
    InitiativeOutcomeSnapshot snapshot = 5;
    bool passed = 6;
    optional int32 exit_code = 7;
    string report = 8;
    repeated string artifacts = 9;
    string recorded_at = 10;
}
message InitiativeOutcomeReview {
    string statement = 1;
    bool affirmed = 2;
    repeated string evidence = 3;
}
message InitiativeCompletionProposal {
    string id = 1;
    InitiativeOutcomeSnapshot snapshot = 2;
    repeated InitiativeOutcomeReview reviews = 3;
    string proposed_at = 4;
}
message InitiativeCompletionConfirmation {
    string proposal_id = 1;
    string reason = 2;
    string confirmed_at = 3;
    optional string last_error = 4;
}
message InitiativeEtCloseReceipt { string intent_ref = 1; string completed_at = 2; string proposal_id = 3; }
message DeriveSource { string repo = 1; string from = 2; }
message MemberHold { string member = 1; repeated string until = 2; string reason = 3; bool owner = 4; }
message MemberMilestone { string member = 1; string name = 2; repeated string evidence = 3; }
message TaskDispatch { string member = 1; string work_item = 2; string project = 3; }
message MemberReservation { string member = 1; string operation_id = 2; string kind = 3; }
message SteeringLease { string id = 1; string fingerprint = 2; }
message EtCloseProposal { string intent_ref = 1; repeated string evidence = 2; }
message SteeringRecord { string id = 1; string prompt = 2; string decision_json = 3; optional string provider = 4; string recorded_at = 5; optional string follow_up_of_json = 6; optional string integration_skipped = 7; }
message DurableSteeringAction { string id = 1; string initiative = 2; string decision_json = 3; StageProviders providers = 4; string fingerprint = 5; optional string external_context_json = 6; }
message InitiativeWorkAdmission { string action_id = 1; string member = 2; StageProviders providers = 3; optional string work_item = 4; }
message AdvanceInitiativeRequest {
    string name = 1;
    optional string member = 2;
    string operator_origin = 3;
}
message AdvanceInitiativeResponse {
    Initiative initiative = 1;
    string event_id = 2;
    CampaignWorkInFlight in_flight = 3;
}
message DeriveInitiativeRequest {
    string from_ref = 1;
    repeated string projects = 2;
    string authorized_by = 3;
    string source_repo = 4;
    repeated InitiativeEvidence integration_gates = 5;
}
message HoldInitiativeMember { string member = 1; repeated string until = 2; string reason = 3; }
message RelayInitiativeFinding { string finding_id = 1; repeated string members = 2; }
message DispatchInitiativeTask { string project = 1; string objective = 2; optional string member = 3; }
message AskInitiativeOwner { string question = 1; repeated string members = 2; }
message RecordInitiativeMilestone { string member = 1; string milestone = 2; repeated string evidence = 3; }
message ActOnInitiativeRequest {
    string name = 1;
    string operator_origin = 2;
    oneof action {
        HoldInitiativeMember hold = 3;
        RelayInitiativeFinding relay = 4;
        DispatchInitiativeTask dispatch = 5;
        AskInitiativeOwner ask = 6;
        RecordInitiativeMilestone milestone = 7;
    }
}
message ActOnInitiativeResponse { Initiative initiative = 1; string event_id = 2; }
message AddInitiativeRequest { string definition_json = 1; }
message InitiativeResponse { Initiative initiative = 1; }
message ListInitiativesRequest {}
message ListInitiativesResponse { repeated Initiative initiatives = 1; }
message GetInitiativeRequest { string name = 1; }
message DecideInitiativeRequest {
    string name = 1;
    string decision = 2;
    repeated string members = 3;
    // Additional cycles to add to the initiative's shared `max_cycles` in the
    // same change that records the decision (checked addition; overflow →
    // INVALID_ARGUMENT). Required (> 0) when the initiative has spent its
    // shared budget (FAILED_PRECONDITION otherwise, and nothing is recorded);
    // 0 = no extension.
    uint64 add_cycles = 4;
    // Only these exact questions are answered. Empty means policy only.
    repeated string question_ids = 5;
}
message RecordInitiativeStatusRequest { string name = 1; string text = 2; }
message EndInitiativeRequest { string name = 1; string reason = 2; }
message SetInitiativeBriefRequest { string name = 1; string content = 2; }
message InitiativeBriefResponse { InitiativeBrief brief = 1; string content = 2; }
message FindingSource { string kind = 1; string id = 2; }
message FindingConsumption { string member = 1; string work_item = 2; }
message Finding {
    string id = 1;
    string initiative = 2;
    FindingSource from = 3;
    repeated string to = 4;
    string kind = 5;
    string text = 6;
    repeated string refs = 7;
    repeated FindingConsumption consumed_by = 8;
    string recorded_at = 9;
    AuditEvidence audit = 10;
}
message AuditEvidence {
    string intent_ref = 1;
    string classification = 2;
    string project = 3;
    repeated string paths = 4;
    string explanation = 5;
}
message AddFindingRequest { string definition_json = 1; }
message FindingResponse { Finding finding = 1; }
message ListFindingsRequest { string initiative = 1; string member = 2; }
message ListFindingsResponse { repeated Finding findings = 1; }

message CampaignReportResponse {
    string report_json = 1;
}

message GetCampaignRequest {
    string name = 1;
}

message GetCampaignResponse {
    CampaignDetail campaign = 1;
}

// Pause a campaign. Idempotent on the status field; never clears pending_run_result.
message PauseCampaignRequest {
    string name = 1;
}

message PauseCampaignResponse {
    // Full campaign detail reflecting the state after the pause is applied.
    CampaignDetail campaign = 1;
}

// Resume a paused or escalated campaign, optionally extending its cycle budget.
// `add_cycles` is applied to `budget.max_cycles` exactly once via checked
// addition (overflow → FAILED_PRECONDITION). Pass 0 to resume without
// extending the budget.
// Requires `authorized_by` to be set; returns FAILED_PRECONDITION otherwise.
// Only valid when the campaign is in `paused` or `escalated` status.
message ResumeCampaignRequest {
    string name = 1;
    // Non-negative number of additional cycles to add to `max_cycles`.
    uint64 add_cycles = 2;
}

message ResumeCampaignResponse {
    // Full campaign detail reflecting the state after the resume is applied.
    CampaignDetail campaign = 1;
}

// Record a binding owner decision on an active, paused or escalated campaign.
// Every later formation prompt carries it. An active or paused campaign keeps
// its status, budget and open escalation record. An escalated campaign returns
// to active. A staged, completed or cancelled campaign is refused. A decision
// whose text and owner repeat the latest one on an active or paused campaign
// is refused, so a retry after a success records nothing twice.
message DecideCampaignRequest {
    string name = 1;
    string decision = 2;
    // Additional cycles to add to `max_cycles` in the same transition that
    // records the decision (checked addition; overflow → FAILED_PRECONDITION).
    // Escalated campaigns only: > 0 on an active or paused campaign is
    // FAILED_PRECONDITION (a paused campaign takes cycles through
    // ResumeCampaign). Required (> 0) when an escalated campaign has spent its
    // budget; 0 = no extension.
    uint64 add_cycles = 3;
}

message DecideCampaignResponse {
    // Full campaign detail reflecting the state after the decision is applied.
    CampaignDetail campaign = 1;
}

// Mark an authorized campaign complete from outside the formation loop.
// The non-empty reason is retained as an append-only owner record and the
// daemon emits CampaignCompleted so terminal observers see the transition.
message CompleteCampaignRequest {
    string name = 1;
    string reason = 2;
}

message CompleteCampaignResponse {
    CampaignDetail campaign = 1;
}

// Stop a campaign permanently before its done-evidence is met.
//
// Distinct from CompleteCampaign because `completed` is an evidence claim;
// cancellation records the opposite. The non-empty reason is retained as an
// append-only owner record when the campaign has an owner, and the daemon
// emits CampaignCancelled so terminal observers see the transition.
//
// Unlike CompleteCampaign this does NOT require authorized_by — an
// unauthorized campaign must still be stoppable.
//
// Idempotent on an already-cancelled campaign; FAILED_PRECONDITION on a
// completed one; INVALID_ARGUMENT when the reason is empty.
message CancelCampaignRequest {
    string name = 1;
    string reason = 2;
    // Abort the in-flight workflow immediately, killing the running agent
    // process, instead of letting the current cycle finish. Note this kills
    // only the agent itself; tool subprocesses it spawned are reparented and
    // survive.
    bool terminate_now = 3;
    // Throw away the terminated cycle's uncommitted work instead of committing
    // and preserving it. Only meaningful with terminate_now — a cycle allowed
    // to finish has already had its work committed and preserved.
    bool discard_work = 4;
}

message CancelCampaignResponse {
    CampaignDetail campaign = 1;
    // The emitted CampaignCancelled event. Empty when the call was a no-op
    // because the campaign was already cancelled.
    string event_id = 2;
}

// Manually dispatch one advance iteration for an active campaign.
// Valid only when the campaign is `active` or `staged`; returns
// FAILED_PRECONDITION for `paused`, `escalated`, or `completed` campaigns.
message AdvanceCampaignRequest {
    string name = 1;
    // Opaque operator context for this manual advance: the CLI client's
    // hostname, plus any `--origin` text the operator passed.
    //
    // Additive and optional. Empty means "no operator context", and a request
    // that omits it dispatches exactly as before, recording the campaign name
    // and cycle alone as the work item's origin. The daemon never parses,
    // validates, filters or groups on this value, and no dispatch is rejected,
    // delayed or altered because of it — it is carried onto the cycle's
    // ExecutionRequested and recorded in the work-item ledger verbatim.
    string operator_origin = 2;
}

message AdvanceCampaignResponse {
    // Current campaign detail at the time the advance was dispatched.
    // The advance itself is asynchronous; poll GetCampaign to observe the
    // outcome.
    CampaignDetail campaign = 1;
    // Root event ID of the CampaignAdvanceRequested workflow. Empty when
    // `in_flight` is set, because nothing was dispatched.
    string event_id = 2;
    // Set when the campaign already had an advance or a cycle submitted,
    // queued, held or running. The request was a no-op; this names the work
    // a second advance would have duplicated.
    CampaignWorkInFlight in_flight = 3;
}

// Campaign work that was already in flight when an advance was requested.
message CampaignWorkInFlight {
    // "advance" for a formation workflow, "cycle" for a dispatched task.
    string kind = 1;
    // Work-item id in the ledger. Empty for an advance the daemon accepted
    // moments ago and has not yet recorded in the ledger.
    string work_item_id = 2;
    // Ledger state: submitted, queued, held or running. "submitted" also for
    // an advance not yet recorded in the ledger.
    string state = 3;
    // Root event ID of the in-flight workflow, when known.
    string event_id = 4;
}

// Wire form of a sentinel — a scheduled trigger that emits an event when due.
message Sentinel {
    string name = 1;
    // Cron schedule in standard 5-field form (e.g. "0 2 * * *"), evaluated in
    // local time. The daemon auto-pads 5-field expressions with a leading "0"
    // for seconds before passing them to the cron parser.
    string cron = 2;
    // Event type the sentinel emits when it fires (e.g. "maintenance_cycle_started").
    string emit_event_type = 3;
    // Project name set on the emitted event (e.g. "system" for cycle-roots).
    string emit_project = 4;
    // Throttle level: 0 = full (default), 1 = dry_run.
    int32 emit_throttle = 5;
    // JSON payload attached to the emitted event ("{}" if empty).
    string emit_payload_json = 6;
    bool enabled = 7;
}

// Mark a sentinel as enabled. Wakes the scheduler so the next firing is
// armed immediately.
message SentinelEnableRequest {
    string name = 1;
}

message SentinelEnableResponse {
    Sentinel sentinel = 1;
}

// Mark a sentinel as disabled. Wakes the scheduler so any pending firing
// for this entry is cancelled.
message SentinelDisableRequest {
    string name = 1;
}

message SentinelDisableResponse {
    Sentinel sentinel = 1;
}

// List every daemon-owned sentinel.
message SentinelListRequest {}

message SentinelListResponse {
    repeated Sentinel sentinels = 1;
}

// Retrieve one daemon-owned sentinel by exact name.
message SentinelShowRequest {
    string name = 1;
}

message SentinelShowResponse {
    Sentinel sentinel = 1;
}

// Wire form of one durable work-item ledger record — a unit of work Foundry
// dispatched. Carries every durable field of the on-disk item; the fields that
// only a settled item has are `optional`, so a caller can tell "not recorded"
// from a recorded empty string or `false`.
message WorkItem {
    // Stable identity, minted at submission (e.g. "wi_" + 24 hex characters).
    string id = 1;
    // Registry project name.
    string project = 2;
    // The task description or campaign objective the work serves.
    string objective = 3;
    // What sort of work this is: task | campaign_cycle | maintenance |
    // major_upgrade | release | remediation | workflow | follow_up.
    string kind = 4;
    // Which queue it belongs to: interactive | campaign | maintenance.
    string lane = 5;
    // Opaque submitter text. Foundry never interprets it.
    string origin = 6;
    // When the item entered the ledger (ISO 8601).
    string submitted_at = 7;
    // When an agent started on it (ISO 8601). Absent when it never started.
    optional string started_at = 8;
    // When it settled (ISO 8601). Absent while it is still unsettled.
    optional string settled_at = 9;
    // Where it stands: submitted | queued | running | landed | preserved |
    // needs_decision | failed | cancelled.
    string state = 10;
    // Why it is in that state, in one line.
    string reason = 11;
    // The workflow trace the item belongs to. Absent when it carries none.
    optional string trace_id = 12;
    // Settlement: the reviewer's typed verdict tag. Absent until it settles.
    optional string verdict = 13;
    // Settlement: the trunk commit the work landed as, or the verified registered
    // trunk commit carrying superseded preserved work. Automatic supersession runs
    // only after actual task landing, on same-project preserved items, with reason
    // `superseded by <commit>` and a work_item_settled event on the item's trace.
    // Unresolved evidence leaves the item open. No scheduled reconciler is implied.
    optional string landed_commit = 14;
    // Settlement: the durable ref (a branch name, or "bundle:" followed by a
    // path) holding preserved work. Retained after resume landing or supersession.
    optional string preservation_ref = 15;
    // Settlement: the isolated worktree the work ran in. Absent when none was
    // recorded.
    optional string worktree = 16;
    // Settlement: whether that worktree was gone by settlement time. Absent
    // when the item records no worktree, which is why this is `optional` — a
    // recorded `false` and "not recorded" are different facts.
    optional bool worktree_removed = 17;
    WorkItemOperatorAction operator_action = 18;
    optional string resumes = 19;
    // What dispatched the work, typed (see WorkSource): recorded at
    // submission beside the untouched free-text `origin`, never changed.
    // Absent when the item records none — every item written before this
    // field existed — and a client built from the previous proto parses the
    // record exactly as before. Additive.
    WorkSource source = 20;
    // Pacing: the items this one waits on (`foundry task --after`). It starts
    // only once every one has settled `landed`. Empty when it waits on none.
    // Additive.
    repeated string depends_on = 21;
    // Pacing: the earliest time the scheduler may start it (ISO 8601). Absent
    // when unset. Additive.
    optional string not_before = 22;
    // Lineage: the open items this task follows up on (`foundry task
    // --continues`). When it lands, each one still open settles `landed` with
    // reason `superseded by <commit> via <this id>`, and so on through the
    // lineage (`resumes` and `continues`) of every item settled that way.
    // Empty when it continues none. Additive.
    repeated string continues = 23;
    // The obligation a follow_up item holds (see WorkItemFollowUp). Absent on
    // every other kind. Additive.
    WorkItemFollowUp follow_up = 24;
}

// An obligation a landed item left behind, held by a follow_up item until a
// task that continues it lands (or an owner closes it).
message WorkItemFollowUp {
    // The landed item this obligation follows.
    string of = 1;
    // The trunk commit the obligation refers to. Absent when none was recorded.
    optional string commit = 2;
    // What is owed: remainder (gaps the reviewer reported when the work landed
    // with a remainder verdict).
    string obligation = 3;
    // remainder: the gaps still to do, one per entry.
    repeated string gaps = 4;
}

// Owner controls retain submission origin, trace, disposition and prior settlement.
message WorkItemOperatorAction {
    string command = 1;
    string origin = 2;
    string previous_state = 3;
    string previous_reason = 4;
    optional string previous_settled_at = 5;
}

// Close only preserved/needs_decision/failed items. Reason and operator_origin
// must be nonblank. Invalid input: INVALID_ARGUMENT; absent id: NOT_FOUND;
// other states or malformed ledger: FAILED_PRECONDITION; I/O faults: INTERNAL.
// Reload and atomically save under the shared ledger gate before emitting
// work_item_cancelled. Never dispatch, abort, or dispose of work.
message CloseWorkItemRequest {
    string id = 1;
    string reason = 2;
    string operator_origin = 3;
}
message CloseWorkItemResponse { WorkItem item = 1; }

// Cancel only submitted/queued/held items with the reason "cancelled by
// operator". Same validation, persistence and event contract as CloseWorkItem.
message CancelWorkItemRequest {
    string id = 1;
    string operator_origin = 2;
}
message CancelWorkItemResponse { WorkItem item = 1; }

// Hold a queued item: it leaves the scheduler's hands until released. Only a
// `queued` item can be held; any other state is FAILED_PRECONDITION. Same
// validation and persistence contract as CloseWorkItem, then work_item_held
// on Watch and in the durable log. Additive.
message HoldWorkItemRequest {
    string id = 1;
    string operator_origin = 2;
}
message HoldWorkItemResponse { WorkItem item = 1; }

// Release a held item, or one the scheduler moved to needs_decision because a
// dependency settled some way other than landed, back to the queue. A released
// dependent runs regardless of that dependency: the settled dependencies are
// dropped from depends_on, and the recorded reason is the scheduler's own
// verdict for the item as it now stands. Any other state, a needs_decision item
// that holds no root to start from, and every follow_up item (resume it
// instead) is FAILED_PRECONDITION. Emits work_item_released. Additive.
message ReleaseWorkItemRequest {
    string id = 1;
    string operator_origin = 2;
}
message ReleaseWorkItemResponse { WorkItem item = 1; }

// One item as the pacing view lists it: what it occupies (running) or why it
// waits (queued, held).
message PacingItem {
    string id = 1;
    string project = 2;
    // The repository the per-repository rule keys the item on.
    string repository = 3;
    string kind = 4;
    string lane = 5;
    string state = 6;
    string reason = 7;
    // started_at for a running item, submitted_at for a waiting one (ISO 8601).
    string since = 8;
}

// The pacing stage as it stands: the limits in force, what is running per
// repository and on the host, every waiting item with its reason, and which
// lanes are paused. Loaded from the ledger and the pacing files on every call.
message PacingStatus {
    // The host running cap from pacing.json (default 2).
    uint64 max_running = 1;
    // How many items are running on this host now.
    uint64 running = 2;
    // The paused lanes, as lane tags, in lane order.
    repeated string paused_lanes = 3;
    repeated PacingItem running_items = 4;
    // Queued items in the scheduler's priority order, then held items.
    repeated PacingItem waiting_items = 5;
}

message GetPacingRequest {}
message GetPacingResponse { PacingStatus pacing = 1; }

// Pause the named lanes (`interactive`, `campaign`, `maintenance`; empty means
// every lane): nothing in them starts until resumed. Running items are
// untouched. The pause is persisted through an atomic rename and is in force
// after a restart. An unknown lane is INVALID_ARGUMENT; a failed save is
// INTERNAL and emits nothing. Emits pacing_paused for the project `system`,
// durable and on Watch, even when every named lane was already paused.
message PausePacingRequest {
    repeated string lanes = 1;
    string operator_origin = 2;
}
message PausePacingResponse { PacingStatus pacing = 1; }

// Resume the named lanes (empty means every lane). The next scheduler tick
// starts the next eligible item. Emits pacing_resumed. Same contract as
// PausePacing.
message ResumePacingRequest {
    repeated string lanes = 1;
    string operator_origin = 2;
}
message ResumePacingResponse { PacingStatus pacing = 1; }

// Online-only reconciliation. Runs the canonical work_reconcile_started workflow
// against daemon-owned state and returns this invocation's digest, never a client file.
message ReconcileWorkRequest {}
message ReconcileWorkResponse {
    string digest_path = 1;
    string markdown = 2;
    string completion_json = 3;
}

// Resume preserved work with usable preservation evidence, or an open
// (needs_decision or failed) follow_up. Persists a new linked task, queued for
// the pacing scheduler; the original stays open until actual landing. Preserved
// work resumes from its preservation ref and the child records `resumes`; a
// follow-up's child starts from current trunk with the follow-up's objective
// and records `continues`, so its landing settles the follow-up. Admission stages a failed child with reason "resume admission
// incomplete; execution not dispatched", no started_at and a settled_at. It
// becomes queued only after the work_item_submitted root is durably appended
// and the ledger saved; the scheduler starts it and emits work_item_started.
// Initial ledger-save failure creates no child or lifecycle events. Later failure
// leaves the staged failed child, preserves parent/siblings and dispatches nothing.
// Successful earlier appends remain in history (even a partial append is never
// repaired by rewriting/truncation). Watch publishes a lifecycle root only after
// its append succeeds; a rejected admission may therefore have submitted evidence
// if the final ledger save fails, never a failed write.
// INVALID_ARGUMENT: blank input, an unknown depends_on id, or an unparsable
// not_before; NOT_FOUND: unknown id; FAILED_PRECONDITION: ineligible
// state/project/evidence; INTERNAL: persistence or I/O failure.
message ResumeWorkItemRequest {
    string id = 1;
    string operator_origin = 2;
    // Pacing: items the child waits on (`--after`). Each must be in the ledger.
    // Additive.
    repeated string depends_on = 3;
    // Pacing: the earliest start time (`--not-before`), ISO 8601. Empty means
    // at once. Additive.
    string not_before = 4;
}
message ResumeWorkItemResponse { WorkItem item = 1; }

// List records from the daemon-owned work-item ledger.
//
// Online CLI callers render this response directly and never read the
// client-side ledger file; if the client-side path is absent, the online path
// leaves it absent. The store is loaded from disk on every call and nothing is
// cached between requests. A missing or empty store is an empty list; a
// malformed store is a gRPC error (FAILED_PRECONDITION), and an unreadable
// path is INTERNAL. This RPC never writes and never takes the ledger write
// gate.
//
// Ordering is deterministic and independent of store order: `running` items
// first by started_at ascending; then submitted/queued by submitted_at
// ascending; then open items (preserved, needs_decision, failed) by settled_at
// descending; then terminal items (landed, cancelled) by settled_at
// descending. Ties within a group break by id ascending.
message ListWorkItemsRequest {
    // Exact-match project filter. Empty means every project.
    string project = 1;
    // Exact-match state filter, given as the item state's serialized tag.
    // Empty means every state; an unknown tag is INVALID_ARGUMENT.
    string state = 2;
    // Exact-match source filter: the source kind's tag and the reference (see
    // WorkSource). Both empty means every source, and an item that records no
    // source is then listed like any other. A kind and ref select exactly the
    // items whose recorded source is that kind with that reference — every
    // cycle of a campaign, say — in the same deterministic order; an item with
    // no recorded source never matches. An unknown kind, or a kind without a
    // ref, is INVALID_ARGUMENT. Additive.
    string source_kind = 3;
    string source_ref = 4;
}

message ListWorkItemsResponse {
    repeated WorkItem items = 1;
}

// Retrieve one work-item ledger record by exact id.
//
// Online CLI callers render this response directly and never read the
// client-side ledger file; if the client-side path is absent, the online path
// leaves it absent. The store is loaded from disk on every call and nothing is
// cached between requests. A missing or empty store yields NOT_FOUND, as does
// any id absent from a non-empty store; a malformed store is
// FAILED_PRECONDITION and an unreadable path is INTERNAL. This RPC never
// writes and never takes the ledger write gate.
message GetWorkItemRequest {
    string id = 1;
}

message GetWorkItemResponse {
    WorkItem item = 1;
}

// Wire form of one `work_item_*` lifecycle event read back from the durable
// event log: `work_item_submitted`, `work_item_started`, `work_item_settled`
// or `work_item_cancelled`.
message WorkItemEvent {
    // The event's own id.
    string id = 1;
    // The event type's serialized tag, e.g. "work_item_settled".
    string event_type = 2;
    // When the event occurred (ISO 8601).
    string occurred_at = 3;
    // Where the item stood as of this event, as the item state's serialized
    // tag (same vocabulary as WorkItem.state).
    string state = 4;
    // Why it was in that state, in one line.
    string reason = 5;
    // The workflow trace the event was emitted on. Absent when it carries none.
    optional string trace_id = 6;
}

// List one work item's `work_item_*` events from the durable event log
// (`FOUNDRY_EVENTS_DIR`, one `YYYY-MM.jsonl` file per month).
//
// Additive to GetWorkItem: a caller that never sends this request sees exactly
// the GetWorkItem and ListWorkItems behaviour it saw before. Online CLI callers
// render this response directly and never read the client-side ledger or
// events files; if those client-side paths are absent, the online path leaves
// them absent. The ledger and the event log are loaded from disk on every call
// and nothing is cached between requests. This RPC never writes and never
// takes the ledger write gate.
//
// Events are selected by exact payload `item_id` — never by trace id and never
// by project, since one run's items can share both — from every monthly file
// regardless of age, and returned in chronological order: occurred_at
// ascending, ties in log order.
//
// An id absent from the ledger is NOT_FOUND (a malformed ledger is
// FAILED_PRECONDITION and an unreadable ledger path is INTERNAL, as for
// GetWorkItem). A known item with no events in the log, or a missing events
// directory, is an empty list. An I/O fault reading an existing events
// directory or log file is INTERNAL, never an empty list. A malformed line in
// the log (not JSON, or two events glued onto one line) is skipped with a
// warning in the daemon log; the item's well-formed events on other lines are
// still returned.
message ListWorkItemEventsRequest {
    string id = 1;
}

message ListWorkItemEventsResponse {
    repeated WorkItemEvent events = 1;
}

// The Foundry service.
service Foundry {
    // Emit an event into the system. May trigger a workflow.
    rpc Emit(EmitRequest) returns (EmitResponse);

    // Get status of active workflows.
    rpc Status(StatusRequest) returns (StatusResponse);

    // List durable trace history from the daemon-owned trace store.
    rpc History(HistoryRequest) returns (HistoryResponse);

    // Stream events in real-time as they occur during engine processing.
    rpc Watch(WatchRequest) returns (stream WatchResponse);

    // Retrieve the trace of a completed event chain.
    rpc Trace(TraceRequest) returns (TraceResponse);

    // Add a project to the daemon-owned registry.
    rpc RegistryAdd(RegistryAddRequest) returns (RegistryAddResponse);

    // List every project from the daemon-owned registry.
    rpc RegistryList(RegistryListRequest) returns (RegistryListResponse);

    // Retrieve one project from the daemon-owned registry by exact name.
    rpc RegistryShow(RegistryShowRequest) returns (RegistryShowResponse);

    // Remove a project from the daemon-owned registry.
    rpc RegistryRemove(RegistryRemoveRequest) returns (RegistryRemoveResponse);

    // Edit a project in the daemon-owned registry.
    rpc RegistryEdit(RegistryEditRequest) returns (RegistryEditResponse);

    // Add one durable campaign definition to the configured campaign store.
    rpc AddInitiative(AddInitiativeRequest) returns (InitiativeResponse);
    rpc AdvanceInitiative(AdvanceInitiativeRequest) returns (AdvanceInitiativeResponse);
    rpc DeriveInitiative(DeriveInitiativeRequest) returns (InitiativeResponse);
    rpc ActOnInitiative(ActOnInitiativeRequest) returns (ActOnInitiativeResponse);
    rpc ListInitiatives(ListInitiativesRequest) returns (ListInitiativesResponse);
    rpc GetInitiative(GetInitiativeRequest) returns (InitiativeResponse);
    rpc DecideInitiative(DecideInitiativeRequest) returns (InitiativeResponse);
    // New clients must use this method so older daemons refuse safely.
    rpc RecordInitiativeDecision(DecideInitiativeRequest) returns (InitiativeResponse);
    rpc RecordInitiativeStatus(RecordInitiativeStatusRequest) returns (InitiativeResponse);
    rpc RecoverInitiative(RecoverRequest) returns (RecoverResponse);
    rpc RecoverCampaign(RecoverRequest) returns (RecoverResponse);
    rpc CompleteInitiative(EndInitiativeRequest) returns (InitiativeResponse);
    rpc CancelInitiative(EndInitiativeRequest) returns (InitiativeResponse);
    rpc SetInitiativeBrief(SetInitiativeBriefRequest) returns (InitiativeBriefResponse);
    rpc GetInitiativeBrief(GetInitiativeRequest) returns (InitiativeBriefResponse);
    rpc AddFinding(AddFindingRequest) returns (FindingResponse);
    rpc ListFindings(ListFindingsRequest) returns (ListFindingsResponse);

    rpc AddCampaign(AddCampaignRequest) returns (AddCampaignResponse);

    // List durable campaigns from the configured campaign store.
    rpc ListCampaigns(ListCampaignsRequest) returns (ListCampaignsResponse);

    // Retrieve the complete durable definition of one campaign by exact name.
    rpc GetCampaign(GetCampaignRequest) returns (GetCampaignResponse);
    rpc GetCampaignReport(GetCampaignRequest) returns (CampaignReportResponse);

    // Pause an active campaign. Preserves pending_run_result.
    rpc PauseCampaign(PauseCampaignRequest) returns (PauseCampaignResponse);

    // Resume a paused or escalated campaign, optionally extending its cycle budget.
    rpc ResumeCampaign(ResumeCampaignRequest) returns (ResumeCampaignResponse);

    // Record a binding owner decision; an escalated campaign also returns to active.
    rpc DecideCampaign(DecideCampaignRequest) returns (DecideCampaignResponse);

    // Mark an authorized campaign complete with an auditable owner reason.
    rpc CompleteCampaign(CompleteCampaignRequest) returns (CompleteCampaignResponse);

    // Stop a campaign permanently, optionally killing the in-flight cycle.
    rpc CancelCampaign(CancelCampaignRequest) returns (CancelCampaignResponse);

    // Manually dispatch one advance iteration for an active campaign.
    rpc AdvanceCampaign(AdvanceCampaignRequest) returns (AdvanceCampaignResponse);

    // Mark a sentinel as enabled. Persists to disk and wakes the scheduler.
    rpc SentinelEnable(SentinelEnableRequest) returns (SentinelEnableResponse);

    // Mark a sentinel as disabled. Persists to disk and wakes the scheduler.
    rpc SentinelDisable(SentinelDisableRequest) returns (SentinelDisableResponse);

    // List every daemon-owned sentinel.
    rpc SentinelList(SentinelListRequest) returns (SentinelListResponse);

    // Retrieve one daemon-owned sentinel by exact name.
    rpc SentinelShow(SentinelShowRequest) returns (SentinelShowResponse);

    // List records from the daemon-owned work-item ledger, loaded at request
    // time. Optional exact-match project and state filters; deterministic
    // order.
    rpc ListWorkItems(ListWorkItemsRequest) returns (ListWorkItemsResponse);

    // Retrieve one work-item ledger record by exact id, loaded at request time.
    rpc GetWorkItem(GetWorkItemRequest) returns (GetWorkItemResponse);
    rpc CloseWorkItem(CloseWorkItemRequest) returns (CloseWorkItemResponse);
    rpc ResumeWorkItem(ResumeWorkItemRequest) returns (ResumeWorkItemResponse);
    // No offline fallback. INTERNAL on inspection, ledger or digest-write failure,
    // or missing completion. Verified settlements may already be durable on failure.
    rpc ReconcileWork(ReconcileWorkRequest) returns (ReconcileWorkResponse);
    rpc CancelWorkItem(CancelWorkItemRequest) returns (CancelWorkItemResponse);
    // Pacing owner controls on one item. Additive.
    rpc HoldWorkItem(HoldWorkItemRequest) returns (HoldWorkItemResponse);
    rpc ReleaseWorkItem(ReleaseWorkItemRequest) returns (ReleaseWorkItemResponse);

    // The pacing stage: limits, running per repository and host, waiting
    // items with reasons, paused lanes. Read-only; loaded at request time.
    rpc GetPacing(GetPacingRequest) returns (GetPacingResponse);
    // Pause or resume pacing lanes. Persisted; in force after a restart.
    rpc PausePacing(PausePacingRequest) returns (PausePacingResponse);
    rpc ResumePacing(ResumePacingRequest) returns (ResumePacingResponse);

    // List one work item's `work_item_*` events from the durable event log,
    // selected by exact item id and in chronological order, loaded at request
    // time.
    rpc ListWorkItemEvents(ListWorkItemEventsRequest) returns (ListWorkItemEventsResponse);

    // Retrieve every event and block execution within a single span.
    rpc Span(SpanRequest) returns (SpanResponse);
}
